apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      imagePullSecrets:
      - name: ecr-creds
      serviceAccountName: resource-manager
      containers:
      - image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/capstone/sandbox:latest
        imagePullPolicy: Always
        name:  sandbox-container
        env:
        - name: SANDBOX_TEMPLATE_IMAGE
          value: "YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/capstone/template:latest"
        - name: SANDBOX_AGENT_IMAGE
          value: "YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/capstone/agent:latest"
        - name: SANDBOX_IMAGE_PULL_SECRET
          value: ecr-creds
        resources:
          limits:
            cpu: "250m"
            memory: "400Mi"
          requests:
            cpu: "100m"
            memory: "200Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        ports:
        - containerPort:  3000
          name:  main-sandbox
