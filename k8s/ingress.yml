apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace-ingress
  labels:
    app.kubernetes.io/name: codespace-ingress
  annotations:
    # Traefik: Use the long-timeout middleware for WebSocket / SSE connections
    traefik.ingress.kubernetes.io/router.middlewares: default-long-timeout@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:

  # -------------------------------------------------------
  # API routes + Frontend (no host restriction)
  # Works with the cluster's public IP on port 80.
  # -------------------------------------------------------
  - http:
      paths:
      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port:
              number: 80
      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port:
              number: 80
      # Frontend SPA — must be last (least specific path)
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-service
            port:
              number: 80

  # -------------------------------------------------------
  # DEVELOPMENT: Preview/Agent subdomains (local minikube only)
  # -------------------------------------------------------
  - host: "*.preview.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.agent.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  # -------------------------------------------------------
  # PRODUCTION: Uncomment and set your real domain after deploy.
  # Get your EC2 public IP from the AWS console, then point
  # a wildcard DNS A record: *.preview.yourdomain.com → EC2-IP
  # -------------------------------------------------------
  # - host: "*.preview.yourdomain.com"
  #   http:
  #     paths:
  #     - pathType: Prefix
  #       path: "/"
  #       backend:
  #         service:
  #           name: router-service
  #           port:
  #             number: 80
  #
  # - host: "*.agent.yourdomain.com"
  #   http:
  #     paths:
  #     - pathType: Prefix
  #       path: "/"
  #       backend:
  #         service:
  #           name: router-service
  #           port:
  #             number: 80