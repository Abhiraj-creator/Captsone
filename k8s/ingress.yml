apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace-ingress
  labels:
    app.kubernetes.io/name: codespace-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:

  # -------------------------------------------------------
  # API routes (no host restriction — works with any domain or IP)
  # -------------------------------------------------------
  - http:
      paths:
      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port:
              number: 80
      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port:
              number: 80
      # Frontend: catch-all (must be last, least specific)
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-service
            port:
              number: 80

  # -------------------------------------------------------
  # DEVELOPMENT: Preview/Agent subdomains (local only)
  # These use *.localhost which only works on your local machine.
  # -------------------------------------------------------
  - host: "*.preview.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.agent.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  # -------------------------------------------------------
  # PRODUCTION: Uncomment and replace with your real domain
  # after deploying to DigitalOcean. Get your domain from
  # the LoadBalancer EXTERNAL-IP: kubectl get svc -n ingress-nginx
  # -------------------------------------------------------
  # - host: "*.preview.yourdomain.com"
  #   http:
  #     paths:
  #     - pathType: Prefix
  #       path: "/"
  #       backend:
  #         service:
  #           name: router-service
  #           port:
  #             number: 80
  #
  # - host: "*.agent.yourdomain.com"
  #   http:
  #     paths:
  #     - pathType: Prefix
  #       path: "/"
  #       backend:
  #         service:
  #           name: router-service
  #           port:
  #             number: 80